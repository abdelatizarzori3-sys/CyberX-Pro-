services:
  cyberx:
    build: .
    ports:
      - "8000:8000"
    environment:
      CYBERX_DB_PATH: /data/cyberx.db
      CYBERX_SESSION_HOURS: "12"
    volumes:
      - cyberx_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  cyberx_data:
